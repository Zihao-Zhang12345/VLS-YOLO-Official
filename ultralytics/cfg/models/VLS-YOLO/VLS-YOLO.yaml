# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 6 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
 n: [0.33, 0.25, 1024]
w_bifpn: &w_bifpn 256
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f_LS, [128, 0.5, 'parallel']]         # 2. Replaced C2f with LS_Block
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f_LS, [256, 0.5, 'parallel']]       # 4. Replaced C2f with LS_Block
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f_LS, [512, 0.5, 'parallel']]     # 6. Replaced C2f with LS_Block
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 6, C2f_LS, [1024, 0.5, 'parallel']] # 8
  - [-1, 1, MDCR, [1024, 5]]       # 9
  - [-1, 1, CAFMAttention, [1024]]   # 10

head:
   # ---------------------------------------------------------------------
  - [4, 1, Conv, [*w_bifpn, 1, 1]]  # 11. P3_in
  - [6, 1, Conv, [*w_bifpn, 1, 1]]  # 12. P4_in (512->256)
  - [10, 1, Conv, [*w_bifpn, 1, 1]]  # 13. P5_in (1024->256)

  # ---------------------------------------------------------------------
  # - [-1, 1, Converse2D, [3, 2, 1, 'replicate']]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 14. P5_in -> P5_up (learned upsample)
  - [[12, 14], 1, WeightedAdd, [2]]                 # 15. P4_td = WeightedAdd(P4_in, P5_up)
  - [-1, 1, Conv, [*w_bifpn, 3, 1]]                 # 16. Conv on P4_td
  - [-1, 3, VSSBLite, [*w_bifpn]]               # 17b. refine P4_td (VSS)

  # - [-1, 1, Converse2D, [3, 2, 1, 'replicate']]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 18. P4_td -> P4_td_up (learned upsample)
  - [[11, 18], 1, WeightedAdd, [2]]                 # 19. P3_out = WeightedAdd(P3_in, P4_td_up)
  - [-1, 1, Conv, [*w_bifpn, 3, 1]]                 # 20. Conv on P3_out
  - [-1, 3, VSSBLite, [*w_bifpn]]               # 21. refine P3_out (VSS)

  # ---------------------------------------------------------------------
  # 3) Bottom-Up path (保持 Conv stride=2 下采样)
  - [-1, 1, Conv, [*w_bifpn, 3, 2]]                 # 22. P3_out -> downsample (P3_down)
  - [[12, 17, 22], 1, WeightedAdd, [3]]            # 23. P4_out = WeightedAdd(P4_in, P4_td, P3_down)
  - [-1, 1, Conv, [*w_bifpn, 3, 1]]                 # 24. Conv on P4_out
  - [-1, 3, VSSBLite, [*w_bifpn]]               # 25. refine P4_out (VSS)

  - [-1, 1, Conv, [*w_bifpn, 3, 2]]                 # 26. P4_out -> downsample (P4_down)
  - [[13, 26], 1, WeightedAdd, [2]]                 # 27. P5_out = WeightedAdd(P5_in, P4_down)
  - [-1, 1, Conv, [*w_bifpn, 3, 1]]                 # 28. Conv on P5_out
  - [-1, 3, VSSBLite, [*w_bifpn]]               # 29. refine P5_out (VSS)

  # ---------------------------------------------------------------------
  
  - [[21, 25, 29], 1, Detect, [nc]]
  #   # ---------------------------------------------------------------------[]


