# M3: M2 + MDCR
# Backbone: C2f_LS + CAFMAttention (MODIFIED)
# Head: Standard PANet (Concat + C2f)

nc: 6 # number of classes
scales: 
  n: [0.33, 0.25, 1024] 

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f_LS, [128, 0.5, 'parallel']]  # 2.
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f_LS, [256, 0.5, 'parallel']]  # 4.
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f_LS, [512, 0.5, 'parallel']]  # 6.
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 6, C2f_LS, [1024, 0.5, 'parallel']] # 8.
  - [-1, 1, MDCR, [1024, 5]]     # 9
  - [-1, 3, CAFMAttention, [1024]] # 10. MODIFIED (Added)

# YOLOv8.0n head (Standard PANet, indices shifted)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11 (was 10)
  - [[-1, 6], 1, Concat, [1]]   # 12. Concat P4 (from layer 6)
  - [-1, 3, C2f, [512]]         # 13. Standard C2f
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]   # 15. Concat P3 (from layer 4)
  - [-1, 3, C2f, [256]]         # 16 (P3_out)

  - [-1, 1, Conv, [256, 3, 2]]  # 17. Downsample
  - [[-1, 13], 1, Concat, [1]]  # 18. Concat P4_td (from layer 13)
  - [-1, 3, C2f, [512]]         # 19 (P4_out)

  - [-1, 1, Conv, [512, 3, 2]]  # 20. Downsample
  - [[-1, 10], 1, Concat, [1]]  # 21. Concat P5 (from layer 10)
  - [-1, 3, C2f, [1024]]        # 22 (P5_out)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)